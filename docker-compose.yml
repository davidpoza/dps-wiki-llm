services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dps_wiki}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-dps_wiki}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-dps_wiki}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dps-wiki

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME:-dps_wiki}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD:-dps_wiki}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dps-wiki

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    command: ["--model-id", "intfloat/multilingual-e5-small", "--port", "8080"]
    environment:
      MODEL_ID: intfloat/multilingual-e5-small
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      start_period: 600s
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - dps-wiki

  web-extractor:
    build:
      context: ./web-extractor
    init: true
    environment:
      PORT: 3000
      EXTRACTOR_CONCURRENCY: ${EXTRACTOR_CONCURRENCY:-3}
      NAV_TIMEOUT_MS: ${EXTRACTOR_NAV_TIMEOUT_MS:-30000}
      NETWORKIDLE_MS: ${EXTRACTOR_NETWORKIDLE_MS:-4000}
      PDF_MAX_BYTES: ${PDF_MAX_BYTES:-20971520}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - dps-wiki

  backend:
    build:
      context: ./backend
    environment:
      EXTRACTOR_BASE_URL: ${EXTRACTOR_BASE_URL:-http://web-extractor:3000}
      EXTRACTOR_TIMEOUT: ${EXTRACTOR_TIMEOUT:-45s}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dps_wiki}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-dps_wiki}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-dps_wiki}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-dps_wiki}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-dps_wiki}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-oss}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://embeddings:8080}
      EMBED_MODEL: ${EMBED_MODEL:-multilingual-e5-small}
      EMBED_DIMENSION: ${EMBED_DIMENSION:-384}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VAULT_PATH: /vault
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:4200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - .:/vault
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      web-extractor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health/readiness >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - dps-wiki

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dps-wiki

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "2141:80"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - dps-wiki

volumes:
  postgres-data:

networks:
  dps-wiki:
    driver: bridge
