app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  llm:
    base-url: ${LLM_BASE_URL}
    model: ${LLM_MODEL}
    api-key: ${LLM_API_KEY}
  telegram:
    token: ${TELEGRAM_BOT_TOKEN}
    allowed-chat-id: ${TELEGRAM_ALLOWED_CHAT_ID}
